<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prouty APRS map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Open Sans",sans-serif}
  #map{position:absolute;inset:0}
  .mapbar{position:absolute;z-index:1000;top:8px;left:8px;background:#fff;border:1px solid #e3e3e3;
    border-radius:6px;padding:6px 10px;font-size:13px;color:#1f3a5f;box-shadow:0 1px 4px #0002}
  .mapbar b{font-weight:600}
  #err{position:absolute;z-index:1001;top:50%;left:50%;transform:translate(-50%,-50%);
    background:#fff;border:1px solid #e3e3e3;border-radius:8px;padding:16px 20px;max-width:80%;
    font-size:14px;color:#333;display:none}
  .leaflet-container{background:#dfe3e8}
</style>
</head><body>
<div id="map"></div>
<div class="mapbar"><b id="title">Prouty APRS</b> &middot; <span id="status">loading&hellip;</span></div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// surface any error (incl. a CDN script that failed to load) instead of hanging
window.addEventListener("error", function (e) {
  var el = document.getElementById("err"), st = document.getElementById("status");
  if (el) { el.style.display = "block";
            el.textContent = "Map error: " + ((e && e.message) || "a script failed to load"); }
  if (st) st.textContent = "error";
}, true);

(function () {
  if (typeof L === "undefined" || typeof JSZip === "undefined") {
    var el = document.getElementById("err"), st = document.getElementById("status");
    if (el) { el.style.display = "block";
      el.textContent = "Map libraries did not load (Leaflet / JSZip from cdnjs). " +
                       "This device or network may be blocking cdnjs.cloudflare.com."; }
    if (st) st.textContent = "error";
    return;
  }
  // Which day's overlay to show. ?day=friday|saturday, or an explicit ?kmz=<url>.
  var params = new URLSearchParams(location.search);
  var day = (params.get("day") || "friday").toLowerCase();
  // overlay sits in the SAME folder as this page (html/), fetched relatively,
  // so it uses the exact path depth the report pages already serve from --
  // avoiding the gate's trouble with deeper paths.
  var DAYS = {
    friday:   { kmz: "fri-overlay.kmz", title: "The Prouty Ultimate — Friday" },
    saturday: { kmz: "sat-overlay.kmz", title: "The Prouty — Saturday" }
  };
  var cfg = DAYS[day] || DAYS.friday;
  var kmzUrl = params.get("kmz") || cfg.kmz;
  document.getElementById("title").textContent = cfg.title;

  var map = L.map("map", { preferCanvas: true });
  var A = "https://server.arcgisonline.com/ArcGIS/rest/services/";
  // Topographic: roads, town names and terrain shading (default).
  var topo = L.tileLayer(A + "World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, attribution: "Tiles © Esri" });
  // Plain street map.
  var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, attribution: "© OpenStreetMap contributors" });
  // Satellite with road + place labels on top (hybrid).
  var hybrid = L.layerGroup([
    L.tileLayer(A + "World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery © Esri" }),
    L.tileLayer(A + "Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }),
    L.tileLayer(A + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })
  ]);
  topo.addTo(map);
  map.setView([43.9, -72.2], 9);

  function fail(msg) {
    var e = document.getElementById("err");
    e.innerHTML = msg; e.style.display = "block";
    document.getElementById("status").textContent = "error";
  }

  // KML colour is aabbggrr; return #rrggbb.
  function kmlColor(s) {
    if (!s || s.length < 8) return "#1f3a5f";
    var bb = s.substr(2, 2), gg = s.substr(4, 2), rr = s.substr(6, 2);
    return "#" + rr + gg + bb;
  }

  function parseCoords(text) {
    var pts = [];
    text.trim().split(/\s+/).forEach(function (tok) {
      var p = tok.split(",");
      if (p.length >= 2) {
        var lon = parseFloat(p[0]), lat = parseFloat(p[1]);
        if (!isFinite(lat) || !isFinite(lon)) return;
        if (Math.abs(lat) < 0.05 && Math.abs(lon) < 0.05) return;  // drop null-island (0,0) fixes
        pts.push([lat, lon]);
      }
    });
    return pts;
  }

  // KML carries a default xmlns, so use getElementsByTagName (namespace-agnostic
  // on the element's local name) rather than CSS selectors, which would miss
  // namespaced elements. First descendant by tag name, scoped to a parent.
  function first(el, tag) {
    var n = el.getElementsByTagName(tag);
    return n.length ? n[0] : null;
  }

  function render(kmlText) {
    var xml = new DOMParser().parseFromString(kmlText, "text/xml");
    if (xml.getElementsByTagName("parsererror").length) return fail("Could not parse the map data.");

    // style id -> line colour, from every <Style> in the document
    var colors = {};
    var styles = xml.getElementsByTagName("Style");
    for (var i = 0; i < styles.length; i++) {
      var id = styles[i].getAttribute("id");
      var ls = first(styles[i], "LineStyle");
      var col = ls && first(ls, "color");
      if (id && col) colors[id] = kmlColor(col.textContent.trim());
    }

    // Compute the extent from the points directly, rather than calling
    // getBounds() on a group of layerGroups (layerGroups expose no getBounds,
    // which threw "getLatLng is not a function").
    var overlays = {}, count = 0, bounds = L.latLngBounds([]);
    var pms = xml.getElementsByTagName("Placemark");
    for (var j = 0; j < pms.length; j++) {
      var pm = pms[j];
      var ls2 = first(pm, "LineString");
      var coordEl = ls2 && first(ls2, "coordinates");   // LineString's, not the Point's
      if (!coordEl) continue;
      var nameEl = first(pm, "name");
      var name = (nameEl && nameEl.textContent.trim()) || "track";
      var refEl = first(pm, "styleUrl");
      var ref = refEl ? refEl.textContent.trim().replace("#", "") : "";
      var color = colors[ref] || "#1f3a5f";
      var pts = parseCoords(coordEl.textContent);
      if (pts.length < 2) continue;
      var layer = L.layerGroup();
      L.polyline(pts, { color: color, weight: 3, opacity: 0.9 }).addTo(layer);
      L.circleMarker(pts[pts.length - 1], { radius: 4, color: "#000", weight: 1,
        fillColor: color, fillOpacity: 1 }).bindTooltip(name).addTo(layer);
      layer.addTo(map);
      overlays[name] = layer;
      for (var k = 0; k < pts.length; k++) bounds.extend(pts[k]);
      count++;
    }

    if (!count) return fail("No tracks found in this overlay.");
    if (bounds.isValid()) map.fitBounds(bounds.pad(0.05));
    L.control.layers({ "Topographic": topo, "Streets": osm, "Satellite + labels": hybrid },
      overlays, { collapsed: true }).addTo(map);
    document.getElementById("status").textContent = count + " rovers";
  }

  fetch(kmzUrl, { credentials: "include" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    })
    .then(function (buf) { return JSZip.loadAsync(buf); })
    .then(function (zip) {
      var kmlName = Object.keys(zip.files).find(function (n) { return /\.kml$/i.test(n); });
      if (!kmlName) throw new Error("no KML inside KMZ");
      return zip.files[kmlName].async("string");
    })
    .then(render)
    .catch(function (e) {
      fail("Could not load the map (" + e.message + "). If you are not signed in to the " +
           "Prouty records, open a report page first, then reload.");
    });
})();
</script>
</body></html>
